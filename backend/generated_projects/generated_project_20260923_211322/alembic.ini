[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# env.py should override this URL using application configuration.
# Do not store production credentials in this file.
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/fastapi_auth

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
